<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Line Esports - Sign Up</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: red;
      filter: blur(180px);
      opacity: .18;
      border-radius: 50%;
      z-index: -1;
    }
    
    .container {
      width: 90%;
      max-width: 400px;
      background: #1b1b1b;
      border: 2px solid #ff0000;
      border-radius: 18px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 0, .45);
    }
    
    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #ff2d2d;
      text-shadow: 0 0 12px red;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #ccc;
      margin-bottom: 25px;
    }
    
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      background: #2b2b2b;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    
    input:focus {
      border: 2px solid red;
    }
    
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ff0000;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .3s;
    }
    
    button:hover {
      background: #b80000;
    }
    
    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #ff5555;
    }
    
    .login {
      margin-top: 20px;
      color: #bbb;
    }
    
    .login a {
      color: #ff2d2d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  
  <div class="container">
    
    <div class="logo">
      🦁 RED LINE ESPORTS
    </div>
    
    <div class="subtitle">
      Create Account
    </div>
    
    <input type="text" id="name" placeholder="Full Name">
    
    <input type="email" id="email" placeholder="Email">
    
    <input type="password" id="password" placeholder="Password">
    
    <button id="signupBtn">
      Create Account
    </button>
    
    <div class="message" id="message"></div>
    
    <div class="login">
      Already have an account?
      <a href="index.html">Login</a>
    </div>
    
  </div>
  
  <script type="module" src="signup.js"></script>
  
</body>

</html>
