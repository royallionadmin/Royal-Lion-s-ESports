<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
padding:20px;
}

.header{
text-align:center;
font-size:30px;
font-weight:bold;
color:#ff2d2d;
text-shadow:0 0 10px red;
margin:25px 0;
}

.container{
max-width:500px;
margin:auto;
background:#1b1b1b;
border:2px solid #ff0000;
border-radius:20px;
padding:25px;
box-shadow:0 0 20px rgba(255,0,0,.35);
}

.profile-pic{
display:flex;
flex-direction:column;
align-items:center;
margin-bottom:25px;
}

.profile-pic img{
width:130px;
height:130px;
border-radius:50%;
border:4px solid #ff0000;
object-fit:cover;
background:#2b2b2b;
}

.profile-pic input{
margin-top:15px;
color:#fff;
}

label{
display:block;
margin:15px 0 6px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2b2b2b;
color:#fff;
font-size:16px;
outline:none;
}

input:focus{
border:2px solid #ff0000;
}

input[readonly]{
background:#202020;
color:#999;
}

button,
a{
display:block;
width:100%;
margin-top:20px;
padding:15px;
border:none;
border-radius:10px;
background:#ff0000;
color:#fff;
text-align:center;
text-decoration:none;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover,
a:hover{
background:#b80000;
}

</style>
</head>
<body>

<div class="header">
✏️ Edit Profile
</div>

<div class="container">


<label>Full Name</label>
<input type="text" id="fullName">

<label>IGN</label>
<input type="text" id="ign">

<label>Free Fire UID</label>
<input type="text" id="ffUid">

<label>WhatsApp Number</label>
<input type="text" id="phone">

<label>Gmail</label>
<input type="email" id="email" readonly>

<label>Facebook</label>
<input type="text" id="facebook">

<button id="saveBtn">
💾 Save Changes
</button>

<a href="profile.html">
⬅️ Back
</a>

</div>

<script type="module" src="edit-profile.js"></script>

</body>
</html>
