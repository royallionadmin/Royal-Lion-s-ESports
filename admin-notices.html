<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Manage Notices</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0d0d0d;
color:white;
padding:20px;

}

.header{

text-align:center;

font-size:32px;

font-weight:bold;

color:#ff2d2d;

text-shadow:0 0 12px red;

margin:25px 0;

}

.container{

max-width:900px;

margin:auto;

}

.form{

background:#1b1b1b;

border:2px solid #ff0000;

border-radius:20px;

padding:25px;

box-shadow:
0 0 15px rgba(255,0,0,.35);

margin-bottom:25px;

}

label{

display:block;

margin-bottom:8px;

margin-top:15px;

font-weight:bold;

}

input,
select,
textarea{

width:100%;

padding:14px;

border:none;

outline:none;

border-radius:10px;

background:#252525;

color:white;

}

textarea{

height:180px;

resize:vertical;

}

.options{

margin-top:20px;

display:flex;

flex-direction:column;

gap:12px;

}

.option{

display:flex;

align-items:center;

gap:10px;

}

.option input{

width:auto;

}

.publishBtn{

width:100%;

margin-top:20px;

padding:15px;

border:none;

border-radius:10px;

background:#ff0000;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.publishBtn:hover{

background:#c40000;

}

.sectionTitle{

font-size:24px;

font-weight:bold;

margin-bottom:15px;

}@media(max-width:700px){

.header{

font-size:26px;

}

.form{

padding:18px;

}

}

.noticeList{

display:flex;

flex-direction:column;

gap:20px;

}

.noticeCard{

background:#1b1b1b;

border:2px solid #ff0000;

border-radius:15px;

padding:20px;

box-shadow:0 0 15px rgba(255,0,0,.3);

}

.noticeTitle{

font-size:22px;

font-weight:bold;

margin-bottom:10px;

}

.noticeType{

display:inline-block;

padding:6px 12px;

border-radius:20px;

background:#ff0000;

font-size:13px;

font-weight:bold;

margin-bottom:12px;

}

.noticeMessage{

color:#ddd;

white-space:pre-wrap;

margin-bottom:15px;

line-height:1.6;

}

.noticeInfo{

display:flex;

flex-wrap:wrap;

gap:15px;

font-size:14px;

color:#999;

margin-bottom:15px;

}

.actions{

display:flex;

gap:10px;

flex-wrap:wrap;

}

.editBtn,
.deleteBtn{

flex:1;

padding:12px;

border:none;

border-radius:8px;

font-weight:bold;

cursor:pointer;

color:white;

}

.editBtn{

background:#007bff;

}

.editBtn:hover{

background:#005fd1;

}

.deleteBtn{

background:#dc3545;

}

.deleteBtn:hover{

background:#b71c1c;

}

.back{

display:block;

max-width:320px;

margin:30px auto 0;

padding:15px;

text-align:center;

background:#ff0000;

color:white;

text-decoration:none;

font-weight:bold;

border-radius:10px;

transition:.3s;

}

.back:hover{

background:#c40000;

}

.empty{

text-align:center;

padding:40px;

color:#888;

font-size:18px;

}

</style>

</head>

<body>

<div class="header">

📢 Manage Notices

</div>

<div class="container">

<div class="form">

<div class="sectionTitle">

Create Notice

</div>

<label>

Title

</label>

<input
type="text"
id="title"
placeholder="Enter notice title">

<label>

Type

</label>

<select id="type">

<option>Announcement</option>

<option>Tournament</option>

<option>Event</option>

<option>Maintenance</option>

<option>Emergency</option>

</select>

<label>

Message

</label>

<textarea
id="message"
placeholder="Write your notice..."></textarea>

<div class="options">

<label class="option">

<input
type="checkbox"
id="pinned">

📌 Pin this notice

</label>

<label class="option">

<input
type="checkbox"
id="popup">

📢 Show as Dashboard Popup

</label>

</div>

<button
id="publishBtn"
class="publishBtn">

➕ Publish Notice

</button>

</div>

<div class="sectionTitle">

Published Notices

</div>

<div
id="noticeList"
class="noticeList">

<div class="empty">

No notices yet.

</div>

</div>

</div>

<a
href="admin.html"
class="back">

⬅ Back to Admin Panel

</a>

<script
type="module"
src="admin-notices.js"></script>

</body>

</html>
