<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Manage Members</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
padding:20px;
}

.header{
text-align:center;
font-size:30px;
font-weight:bold;
color:#ff2d2d;
text-shadow:0 0 12px red;
margin:25px 0;
}

.container{
max-width:750px;
margin:auto;
}

.searchBox{
margin-bottom:25px;
}

.searchBox input{
width:100%;
padding:14px;
background:#1b1b1b;
border:2px solid #ff0000;
border-radius:10px;
color:#fff;
font-size:16px;
outline:none;
}

.searchBox input::placeholder{
color:#888;
}

.member{
background:#1b1b1b;
border:2px solid #ff0000;
border-radius:15px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px rgba(255,0,0,.3);
}

.member h3{
margin-bottom:15px;
color:#fff;
}

.member small{
display:block;
color:#999;
margin-bottom:15px;
}

label{
display:block;
margin-top:12px;
margin-bottom:5px;
font-weight:bold;
color:#ddd;
}

input,
select{
width:100%;
padding:12px;
background:#2b2b2b;
color:white;
border:1px solid #444;
border-radius:8px;
font-size:15px;
outline:none;
}

input:focus,
select:focus{
border-color:#ff0000;
}.save{
margin-top:20px;
width:100%;
padding:14px;
background:#ff0000;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.save:hover{
background:#c40000;
}

.back{
display:block;
margin-top:25px;
padding:15px;
text-align:center;
background:#ff0000;
border-radius:10px;
text-decoration:none;
color:white;
font-weight:bold;
transition:.3s;
}

.back:hover{
background:#c40000;
}

.empty{
text-align:center;
color:#888;
margin-top:40px;
font-size:18px;
}

@media(max-width:500px){

.header{
font-size:25px;
}

.member{
padding:15px;
}

.searchBox input{
font-size:15px;
padding:12px;
}

.save,
.back{
font-size:15px;
}

}

</style>

</head>

<body>

<div class="header">
👥 Manage Members
</div>

<div class="container">

<div class="searchBox">

<input
type="text"
id="searchInput"
placeholder="🔍 Search by Name, UID, Email or Team">

</div>

<div id="membersContainer">

<div class="empty">
Loading members...
</div>

</div>

</div>

<a
href="admin.html"
class="back">

⬅️ Back to Admin Panel

</a>

<script
type="module"
src="manage-members.js"></script>

</body>
</html>
