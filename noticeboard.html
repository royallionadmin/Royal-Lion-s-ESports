<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Notice Board</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#0d0d0d;
color:white;
padding:20px;

}

.header{

text-align:center;

font-size:32px;

font-weight:bold;

color:#ff2d2d;

text-shadow:0 0 12px red;

margin:25px 0;

}

.container{

max-width:900px;

margin:auto;

}

.search{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:12px;

background:#252525;

color:white;

font-size:16px;

margin-bottom:20px;

}

.notice{

background:#1b1b1b;

border:2px solid #ff0000;

border-radius:18px;

padding:20px;

margin-bottom:20px;

box-shadow:

0 0 15px rgba(255,0,0,.35);

transition:.3s;

}

.notice:hover{

transform:translateY(-2px);

}

.notice-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;

gap:10px;

}

.type{

padding:8px 14px;

border-radius:30px;

font-size:14px;

font-weight:bold;

}

.title{

font-size:24px;

font-weight:bold;

margin-bottom:12px;

}

.message{

line-height:1.7;

color:#ddd;

white-space:pre-wrap;

margin-bottom:18px;

}

.footer{

display:flex;

justify-content:space-between;

align-items:center;

font-size:14px;

color:#999;

flex-wrap:wrap;

gap:10px;

}

.pin{

color:gold;

font-weight:bold;

}

.announcement{

background:#1565c0;

}

.tournament{

background:#7b1fa2;

}

.event{

background:#2e7d32;

}

.maintenance{

background:#ef6c00;

}

.emergency{

background:#b71c1c;

}

.empty{

text-align:center;

margin-top:80px;

font-size:20px;

color:#888;

}
@media(max-width:700px){

.notice-header{

flex-direction:column;

align-items:flex-start;

}

.title{

font-size:20px;

}

.footer{

flex-direction:column;

align-items:flex-start;

}

.header{

font-size:26px;

}

}

.back{

display:block;

max-width:320px;

margin:30px auto 0;

padding:15px;

text-align:center;

background:#ff0000;

color:white;

font-weight:bold;

text-decoration:none;

border-radius:10px;

transition:.3s;

}

.back:hover{

background:#c40000;

}

</style>

</head>

<body>

<div class="header">

📢 Notice Board

</div>

<div class="container">

<input

type="text"

id="searchInput"

class="search"

placeholder="🔍 Search notices...">

<div id="noticeList">

<div class="empty">

Loading notices...

</div>

</div>

</div>

<a href="dashboard.html" class="back">

⬅️ Back to Dashboard

</a>

<script type="module" src="noticeboard.js"></script>

</body>

</html>
