<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Terminated</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:#ffffff;
    border:3px solid #d00000;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(180,0,0,0.18);
    overflow:hidden;
    text-align:center;
}

.header{
    background:#d00000;
    color:#ffffff;
    padding:25px 20px;
}

.icon{
    font-size:55px;
    margin-bottom:10px;
}

.header h1{
    font-size:30px;
    font-weight:800;
}

.content{
    padding:40px 30px;
    color:#222;
}

.content h2{
    color:#c00000;
    font-size:24px;
    margin-bottom:20px;
}

.content p{
    font-size:18px;
    line-height:1.7;
}

.facebook{
    display:inline-block;
    margin-top:25px;
    padding:13px 24px;
    background:#d00000;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    transition:0.2s;
}

.facebook:hover{
    background:#a80000;
    transform:translateY(-2px);
}

.thankyou{
    margin-top:30px;
    color:#c00000;
    font-weight:bold;
    font-size:17px;
}

.footer{
    border-top:1px solid #eee;
    padding:15px;
    font-size:13px;
    color:#777;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="icon">⚠️</div>
        <h1>Website Terminated</h1>
    </div>

    <div class="content">

        <h2>We're Sorry for the Inconvenience</h2>

        <p>
            This website has been terminated due to
            <strong>no payment response</strong>.
        </p>

        <p>
            If you have any questions or concerns,
            please reach out to us through Facebook.
        </p>

        <a
            class="facebook"
            href="https://facebook.com/da.one.129"
            target="_blank"
            rel="noopener noreferrer"
        >
            Contact Us on Facebook
        </a>

        <div class="thankyou">
            Thank you for your understanding.
        </div>

    </div>

    <div class="footer">
        © 2026 — Website Terminated
    </div>

</div>

</body>
</html>
