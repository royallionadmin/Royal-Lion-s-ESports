<title>Royal Lion's Esports</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
overflow-x:hidden;
}

/* Header */

.header{
position:fixed;
top:0;
left:0;
width:100%;
height:65px;
background:#111;
border-bottom:2px solid #ff0000;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
z-index:1000;
box-shadow:0 0 15px rgba(255,0,0,.4);
}

.logo{
font-size:20px;
font-weight:bold;
color:#ff2d2d;
text-shadow:0 0 10px red;
user-select:none;
}

.menu-btn{
background:none;
border:none;
color:#fff;
font-size:28px;
cursor:pointer;
transition:.3s;
user-select:none;
}

.menu-btn:hover{
transform:rotate(90deg);
color:#ff2d2d;
}

/* Overlay */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
z-index:998;
}

.overlay.active{
display:block;
}

/* Side Menu */

.side-menu{
position:fixed;
top:0;
right:-260px;
width:250px;
height:100%;
background:#1b1b1b;
border-left:2px solid #ff0000;
transition:.3s;
z-index:999;
padding-top:80px;
box-shadow:-5px 0 20px rgba(255,0,0,.3);
}

.side-menu.active{
right:0;
}

.side-menu a{
display:block;
padding:18px 20px;
color:#fff;
text-decoration:none;
font-size:18px;
border-bottom:1px solid #333;
transition:.3s;
}

.side-menu a:hover{
background:#ff0000;
}

/* Main */

.container{
padding:90px 20px 20px;
display:flex;
flex-direction:column;
align-items:center;
}

.welcome{
font-size:20px;
margin-bottom:10px;
}

.title{
font-size:32px;
font-weight:bold;
color:#ff2d2d;
text-align:center;
text-shadow:0 0 15px red;
margin-bottom:8px;
}

.subtitle{
color:#ccc;
margin-bottom:35px;
text-align:center;
}

.menu{
width:100%;
max-width:450px;
display:flex;
flex-direction:column;
gap:18px;
}

.btn{
display:block;
text-decoration:none;
background:#ff0000;
color:#fff;
padding:15px;
border-radius:10px;
text-align:center;
font-size:18px;
font-weight:bold;
transition:.3s;
user-select:none;
}

.btn:hover{
background:#b80000;
transform:scale(1.03);
box-shadow:0 0 18px red;
}

.footer{
margin-top:40px;
color:#777;
font-size:13px;
text-align:center;
}

@media(max-width:500px){

.logo{
font-size:17px;
}

.title{
font-size:26px;
}

.btn{
font-size:16px;
padding:14px;
}

}

</style>
</head>
