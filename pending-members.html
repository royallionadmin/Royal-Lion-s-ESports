<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Manage Member Status</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
padding:20px;
}

.header{
text-align:center;
font-size:30px;
font-weight:bold;
color:#ff2d2d;
text-shadow:0 0 12px red;
margin:25px 0;
}

.container{
max-width:700px;
margin:auto;
}

.searchBox{
width:100%;
padding:13px;
margin-bottom:15px;
background:#1b1b1b;
color:#fff;
border:1px solid #444;
border-radius:10px;
font-size:16px;
outline:none;
}

.searchBox:focus{
border-color:#ff0000;
}

.filters{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.filter{
padding:13px 8px;
background:#1b1b1b;
color:#fff;
border:2px solid #444;
border-radius:10px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

.filter.active{
border-color:#ff0000;
background:#2b1111;
}

.member{
background:#1b1b1b;
border:2px solid #ff0000;
border-radius:15px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px rgba(255,0,0,.3);
}

.member h3{
margin-bottom:8px;
}

.info{
color:#aaa;
font-size:14px;
margin-bottom:8px;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;
color:#ddd;
}

select{
width:100%;
padding:12px;
background:#2b2b2b;
color:white;
border:1px solid #444;
border-radius:8px;
font-size:15px;
outline:none;
}

select:focus{
border-color:#ff0000;
}

.save{
margin-top:18px;
width:100%;
padding:14px;
background:#ff0000;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.save:hover{
background:#c40000;
}

.empty{
text-align:center;
color:#888;
margin-top:40px;
font-size:18px;
}

.back{
display:block;
max-width:700px;
margin:25px auto 0;
padding:15px;
text-align:center;
background:#ff0000;
border-radius:10px;
text-decoration:none;
color:white;
font-weight:bold;
}

@media(max-width:500px){

.header{
font-size:25px;
}

.filters{
gap:6px;
}

.filter{
font-size:12px;
padding:12px 5px;
}

.member{
padding:15px;
}

}

</style>

</head>

<body>

<div class="header">

👥 Manage Member Status

</div>

<div class="container">

<input
type="text"
id="searchInput"
class="searchBox"
placeholder="🔍 Search player..."
>

<div class="filters">

<button
class="filter"
data-status="Active"
>
🟢 Active
</button>

<button
class="filter"
data-status="Pending"
>
🟡 Pending
</button>

<button
class="filter"
data-status="Suspended"
>
🔴 Suspended
</button>

</div>

<div id="membersContainer">

<div class="empty">
Loading members...
</div>

</div>

</div>

<a
href="admin.html"
class="back"
>
⬅️ Back to Admin Panel
</a>

<script
type="module"
src="pending-members.js">
</script>

</body>

</html>
