<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Members</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    
    body {
      background: #0d0d0d;
      color: #fff;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #ff2d2d;
      text-shadow: 0 0 12px red;
      margin: 25px 0;
    }
    
    .container {
      max-width: 700px;
      margin: auto;
    }
    
    .member {
      background: #1b1b1b;
      border: 2px solid #ff0000;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 0 12px rgba(255, 0, 0, .3);
    }
    
    .member h3 {
      margin-bottom: 8px;
    }
    
    .member p {
      margin: 6px 0;
      color: #ccc;
    }
    
    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .approve {
      background: #00b050;
      color: white;
    }
    
    .view {
      background: #ff0000;
      color: white;
    }
    
    .back {
      display: block;
      margin-top: 25px;
      text-align: center;
      background: #ff0000;
      padding: 15px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    
    .empty {
      text-align: center;
      color: #888;
      margin-top: 50px;
    }
  </style>
  
</head>

<body>
  
  <div class="header">
    👤 Pending Members
  </div>
  
  <div class="container" id="membersContainer">
    
    <div class="empty">
      Loading...
    </div>
    
  </div>
  
  <a href="admin.html" class="back">
    ⬅ Back to Admin Panel
  </a>
  
  <script type="module" src="pending-members.js"></script>
  
</body>

</html>
